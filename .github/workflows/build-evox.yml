name: Build Evolution-X ROM


on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://github.com/Evolution-X/manifest.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'cnb'
      MANIFEST_TREE_URL:
        description: 'MANIFEST_TREE_URL'
        required: true
        default: 'https://github.com/ZeroMayo/local_manifests.git'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'lineage-24.0'
      REPO_MANIFEST:
        description: 'MANIFEST_PATH'
        required: true
        default: 'local_manifests'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'm23xq'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'lineage_m23xq-cp2a-user'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'm evolution'

jobs:
  build-evox:
    runs-on: ubuntu-latest
    timeout-minutes: 960 # Points to your 16GB RAM / 130GB Storage runner configuration
    permissions:
      contents: write
    steps:
    - name: Check if sender is repository owner
      if: github.event.repository.owner.login == github.event.sender.login
      run: |
        echo "Sender is the repository owner"
    - name: Not the repository owner
      if: github.event.repository.owner.login != github.event.sender.login
      run: |
        echo "Sender is not the repository owner"
        exit 1

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    # `maximize-build-space` runs `sudo docker image prune` for remove-docker-images,
    # which aborts with 'sudo: docker: command not found' when the CLI is absent.
    # Prune defensively here instead.
    - name: Remove Docker leftovers
      run: |
        if command -v docker >/dev/null 2>&1; then
          sudo docker image prune --all --force || true
        else
          echo "docker CLI not available - skipping image prune"
        fi
        sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
        df -h /

    # ---------------------------------------------------------------------------
    # 🚀 THE REAL FIX FOR "no space left on device"
    # ubuntu-latest only gives ~14-22 GB free on / , while the extra ~74 GB disk
    # mounted at /mnt is unused. This action frees the preinstalled junk AND merges
    # the free space of / with /mnt into one LVM volume that is mounted over
    # $GITHUB_WORKSPACE, so the source tree, out/ and ccache all live on ~100 GB.
    # It must run BEFORE anything writes into the workspace (it replaces it).
    # ---------------------------------------------------------------------------
    - name: Maximize build disk space
      uses: easimon/maximize-build-space@master
      with:
        # Keep 14 GB free on / for the JDK/apt/SDK installs done by the steps below
        root-reserve-mb: 14336
        temp-reserve-mb: 1024
        # Swap on the merged LVM volume (no longer eats the root filesystem)
        swap-size-mb: 12288
        remove-dotnet: 'true'          # ~17 GB
        remove-android: 'true'         # ~11 GB (the setup script installs its own SDK)
        remove-haskell: 'true'         # ~2.7 GB
        remove-codeql: 'true'          # ~5.4 GB
        # Must stay 'false': the action calls `sudo docker image prune`, which fails
        # with "docker: command not found" on runners without the Docker CLI.
        # Docker leftovers are removed by the step above instead.
        remove-docker-images: 'false'

    - name: Initialize workspace
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        echo "📦 Workspace: $(pwd)"
        df -h .
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update
        sudo apt install git aria2 git-lfs ccache -y
        export JAVA_HOME=$(readlink -f $(which java))
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Repo init (Extreme Architecture & Target Filtering)
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        mkdir lineage
        cd lineage
        
        # 🚀 THE ULTIMATE STRIP: Forcefully excludes TVs, wearables, cars, emulators, and tests
        repo init -u ${{ github.event.inputs.SYNC_URL }} \
          -b ${{ github.event.inputs.MANIFEST_BRANCH }} \
          --depth=1 \
          --git-lfs \
          --partial-clone \
          --clone-filter=blob:limit=10M \
          --groups=default,-mips,-x86,-darwin,-notdefault,-device,-car,-wear,-tv,-simulator,-tests,-vts,-cts
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}


    - name: Clone local manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        git clone ${{ github.event.inputs.MANIFEST_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.REPO_MANIFEST }} --depth=1
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      
    - name: Clone signing keys
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        git clone https://github.com/Evolution-X/vendor_evolution-priv_keys-template vendor/evolution-priv/keys
        cd vendor/evolution-priv/keys
        ./keys.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null && github.event.inputs.COMMON_TREE_URL != ''
        && github.event.inputs.COMMON_PATH != null && github.event.inputs.COMMON_PATH != ''
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }} --depth=1
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Repo sync
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        
    - name: Configure git identity
      run: |
        git config --global user.email "seonghyeon802@gmail.com"
        git config --global user.name "ZeroMayo"
        
    - name: Fix Audio Android.bp select type condition
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        AUDIO_BP="hardware/interfaces/audio/common/all-versions/default/Android.bp"
        if [ -f "$AUDIO_BP" ]; then
            echo "🔧 Fixing Audio select type condition..."
            sed -i 's/"true":/true:/g' "$AUDIO_BP"
            echo "✅ Audio Android.bp patched!"
        else
            echo "⚠️ Audio Android.bp not found, skipping patch."
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Compile
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/lineage/
        
        # 🚀 THE CRITICAL SOURCE PATCH: 
        # Delete the unused Trusty component that is causing the missing VTS dependency crash
        echo "🔧 Patching out unused Trusty dependencies..."
        rm -rf system/core/trusty || true
        rm -rf trusty || true
        
        source build/envsetup.sh
        
        # =================================================================
        # 💾 STORAGE & RAM CONTROLS
        # =================================================================
        echo "💽 Disk space before build:"
        df -h .
        du -sh .repo 2>/dev/null || true

        # ccache must never be allowed to eat the space the build needs:
        # a 50G cache on a ~100G volume guarantees an ENOSPC halfway through.
        export USE_CCACHE=1
        export CCACHE_DIR=${{ steps.pwd.outputs.workspace-folder }}/ccache/
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_COMPRESS=true
        export CCACHE_COMPRESSLEVEL=1
        export CCACHE_MAXSIZE=8G
        export WITH_DEXPREOPT=false
        export WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY=false
        export DISABLE_PROGUARD=true
        export WITHOUT_CHECK_API=true
        export BUILD_FROM_SOURCE_STUB=true
        export ZSTD_CLEVEL=19
        export LZ4_CLEVEL=9
        export DISABLE_ARTIFACT_PATH_REQUIREMENTS=true
        export NINJA_ARGS="-j4"
        export LDFLAGS="-Wl,--threads=1"
        export RBE_num_local_workers=1
        export METALAVA_MAX_HEAP_SIZE=2g
        export _JAVA_OPTIONS="-Xmx3g -XX:MaxMetaspaceSize=512m"
        export NINJA_STATUS="[%p %f/%t] "
        ccache -M 8G || true
        ccache -z || true

        # Fail early with a clear message instead of a cryptic ENOSPC hours later
        AVAIL_GIB=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
        AVAIL_GIB=${AVAIL_GIB:-0}
        echo "📦 Available build space: ${AVAIL_GIB} GiB"
        if [ "${AVAIL_GIB}" -lt 40 ]; then
          echo "::warning::Less than 40 GiB free - this build will likely run out of disk space."
        fi
        
        # Initialize targeting
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}

        # =================================================================
        # 🚀 THE CRITICAL WATCHDOG BYPASS (KEEP-ALIVE LOOP)
        # =================================================================
        bash -c 'while true; do echo "⏳ [WATCHDOG KEEP-ALIVE] Soong is actively parsing blueprints on SSD Swap..."; sleep 60; done' &
        WATCHDOG_PID=$!

        # Execute the build target
        ${{ github.event.inputs.BUILD_TARGET }} $NINJA_ARGS ShowCommands=true

        # Kill the watchdog loop once compilation finishes cleanly
        kill $WATCHDOG_PID || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check the output directory before uploading
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/lineage/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
